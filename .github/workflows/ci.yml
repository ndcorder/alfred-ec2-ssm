name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: python3 -B -m unittest discover -p 'test_*.py' -v
      - name: Check plist
        run: plutil -lint info.plist

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version matches tag
        run: test "$(plutil -extract version raw info.plist)" = "${GITHUB_REF_NAME#v}"
      - name: Package workflow
        run: |
          name="$(plutil -extract name raw info.plist | tr ' ' '-')-${GITHUB_REF_NAME#v}.alfredworkflow"
          zip -r "$name" . -x '.git*' '.github/*' 'test_*.py' 'prefs.plist' '*.md' '__pycache__/*'
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
          generate_release_notes: true
